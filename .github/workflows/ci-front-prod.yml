name: CI Front - Production
#Commentaire de rédéploiment n°1

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - FAC-Front/src/**
      - FAC-Front/public/**
      - FAC-Front/index.html
      - FAC-Front/package.json
      - FAC-Front/package-lock.json
      - FAC-Front/vite.config.ts
      - FAC-Front/tsconfig*.json
      - FAC-Front/env.d.ts
      - FAC-Front/eslint.config.ts
      - FAC-Front/.github/workflows/ci-front-*.yml
      - FAC-Front/vercel.json

  pull_request:
    branches:
      - main
    paths:
      - FAC-Front/src/**
      - FAC-Front/public/**
      - FAC-Front/index.html
      - FAC-Front/package.json
      - FAC-Front/package-lock.json
      - FAC-Front/vite.config.ts
      - FAC-Front/tsconfig*.json
      - FAC-Front/env.d.ts
      - FAC-Front/eslint.config.ts
      - FAC-Front/.github/workflows/ci-front-*.yml
      - FAC-Front/vercel.json

concurrency:
  group: ci-front-prod-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-and-build:
    name: Quality, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: FAC-Front

    steps:
      # 1. Récupération du code source
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Installation de Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: FAC-Front/package-lock.json

      # 3. Installation des dépendances
      - name: Install dependencies
        run: npm ci

      # 4. Analyse statique
      - name: Run ESLint
        run: npx eslint . --max-warnings=0

      # 5. Vérification TypeScript et des composants Vue
      - name: Run type checking
        run: npm run type-check

      # 6. Exécution des tests unitaires Vitest
      - name: Run unit tests
        run: npm run test:unit -- --run

      # 7. Vérification de la compilation
      - name: Build application
        run: npm run build


  deploy-production:
    name: Deploy to Vercel Production
    runs-on: ubuntu-latest
    timeout-minutes: 15

    needs: quality-and-build

    # Le déploiement n'est effectué que lors d'un push sur main.
    # Une Pull Request vers main exécute uniquement les contrôles qualité.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: FAC-Front/package-lock.json

      - name: Install dependencies
        working-directory: FAC-Front
        run: npm ci

      # Vérification des secrets nécessaires au déploiement.
      - name: Validate deployment environment
        run: |
          if [ -z "$VERCEL_ORG_ID" ]; then
            echo "::error::VERCEL_ORG_ID is not available"
            exit 1
          fi

          if [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::VERCEL_PROJECT_ID is not available"
            exit 1
          fi

          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is not available"
            exit 1
          fi

      # Récupération de la configuration Vercel Production,
      # notamment VITE_API_URL.
      - name: Pull Vercel Production configuration
        run: >
          npx vercel@latest pull
          --yes
          --environment=production
          --token="$VERCEL_TOKEN"

      # Build avec les variables de l'environnement Production.
      - name: Build Vercel application
        run: >
          npx vercel@latest build
          --prod
          --token="$VERCEL_TOKEN"

      # Déploiement réel dans l'environnement Production Vercel.
      - name: Deploy to Vercel Production
        id: deploy
        run: |
          DEPLOYMENT_URL="$(
            npx vercel@latest deploy \
              --prebuilt \
              --prod \
              --yes \
              --token="$VERCEL_TOKEN"
          )"

          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "Production deployment URL: $DEPLOYMENT_URL"

      # Vérification que l'application déployée répond correctement.
      - name: Check deployed application
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 5 \
            --retry-delay 5 \
            "${{ steps.deploy.outputs.url }}"

      - name: Deployment summary
        run: |
          echo "## Front-End Production deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Quality checks, tests and build passed successfully." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Front-End Production deployment completed successfully." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"